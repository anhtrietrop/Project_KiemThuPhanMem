services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: singitronic_db
    restart: unless-stopped
    env_file:
      - .env.docker
    # Environment variables are provided via .env.docker (env_file)
    ports:
      - "3307:3306" # Map to 3307 để tránh conflict với MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: singitronic_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3002:3002"
    # Environment variables are provided via .env.docker (env_file)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - ./backend/logs:/usr/src/app/logs

  # Frontend User
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: singitronic_frontend_user
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    # Ensure DATABASE_URL is available to Next.js at runtime (use Docker internal DB service)
    environment:
      - DATABASE_URL=mysql://root:rootpassword123@db:3306/singitronic_nextjs_db
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3002
    depends_on:
      - backend
      - db
    networks:
      - app-network
    volumes:
      - ./frontend-user:/usr/src/app
      - /usr/src/app/node_modules
      # No .next volume in dev mode

  # Frontend Admin
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: singitronic_frontend_admin
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3001:3001"
    # Ensure DATABASE_URL is available to Next.js at runtime (use Docker internal DB service)
    environment:
      - DATABASE_URL=mysql://root:rootpassword123@db:3306/singitronic_nextjs_db
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3002
    depends_on:
      - backend
      - db
    networks:
      - app-network
    volumes:
      - ./frontend-admin:/usr/src/app
      - /usr/src/app/node_modules
      # No .next volume in dev mode

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
