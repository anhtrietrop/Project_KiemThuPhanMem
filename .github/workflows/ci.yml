name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Test Backend (Unit & Integration)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [18.x]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword123
          MYSQL_DATABASE: test_ecommerce_db
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P3307 -uroot -prootpassword123 &> /dev/null; then
              echo "✅ MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Create Test Environment File
        working-directory: ./backend
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          DATABASE_URL="mysql://root:rootpassword123@127.0.0.1:3307/test_ecommerce_db"
          TEST_DATABASE_URL="mysql://root:rootpassword123@127.0.0.1:3307/test_ecommerce_db"
          JWT_SECRET="test-jwt-secret-key-for-ci-environment-only-do-not-use-in-production"
          JWT_EXPIRES_IN="24h"
          NEXTAUTH_SECRET="test-nextauth-secret-for-ci-only"
          MOMO_ACCESS_KEY="test-momo-access-key"
          MOMO_SECRET_KEY="test-momo-secret-key"
          MOMO_PARTNER_CODE="test-partner-code"
          MOMO_ENDPOINT="https://test-payment.momo.vn/v2/gateway/api/create"
          MOMO_REDIRECT_URL="http://localhost:3000/payment/callback"
          MOMO_IPN_URL="http://localhost:3000/api/payment/momo/ipn"
          TEST_TIMEOUT=10000
          DISABLE_EXTERNAL_CALLS=true
          MOCK_SERVICES=true
          EOF

      - name: Setup test database
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword123@127.0.0.1:3307/test_ecommerce_db
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss --skip-generate

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          NODE_ENV: test
          CI: true
          DATABASE_URL: mysql://root:rootpassword123@127.0.0.1:3307/test_ecommerce_db
        run: npm run test:coverage -- --ci --forceExit --detectOpenHandles --passWithNoTests
        continue-on-error: true

      - name: Check coverage thresholds
        working-directory: ./backend
        run: |
          echo "📊 Checking coverage thresholds..."
          node -e "
            try {
              const coverage = require('./coverage/coverage-summary.json');
              const total = coverage.total;
              
              // Cấu hình ngưỡng coverage mục tiêu (50%)
              const thresholds = { lines: 50, statements: 50, functions: 45, branches: 30 };
              let failed = false;
              
              Object.keys(thresholds).forEach(key => {
                const actual = total[key].pct;
                const threshold = thresholds[key];
                const icon = actual >= threshold ? '✅' : '❌';
                console.log(\`\${icon} \${key}: \${actual.toFixed(2)}% (threshold: \${threshold}%)\`);
                if (actual < threshold) {
                  console.error(\`❌ Coverage for \${key} (\${actual.toFixed(2)}%) is below threshold (\${threshold}%)\`);
                  failed = true;
                }
              });
              
              if (failed) {
                console.error('\\n⚠️ Coverage thresholds not met! Please add more tests.');
                // Don't fail CI for now, just warn
              }
              console.log('\\n✅ Coverage check completed!');
            } catch (e) {
              console.warn('⚠️ Could not read coverage summary:', e.message);
              // Don't fail if coverage file doesn't exist
            }
          "
        continue-on-error: true

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            backend/coverage/
          retention-days: 30

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coveragePath = './backend/coverage/coverage-summary.json';

            if (fs.existsSync(coveragePath)) {
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const total = coverage.total;
              
              const statusIcon = (actual, threshold) => actual >= threshold ? '✅' : '❌';
              const thresholds = { lines: 50, statements: 50, functions: 45, branches: 30 };
              
              const comment = \`## 📊 Backend Test Coverage Report
              
              | Metric | Coverage | Threshold | Status |
              |--------|----------|-----------|--------|
              | **Lines** | \${total.lines.pct.toFixed(2)}% | \${thresholds.lines}% | \${statusIcon(total.lines.pct, thresholds.lines)} |
              | **Statements** | \${total.statements.pct.toFixed(2)}% | \${thresholds.statements}% | \${statusIcon(total.statements.pct, thresholds.statements)} |
              | **Functions** | \${total.functions.pct.toFixed(2)}% | \${thresholds.functions}% | \${statusIcon(total.functions.pct, thresholds.functions)} |
              | **Branches** | \${total.branches.pct.toFixed(2)}% | \${thresholds.branches}% | \${statusIcon(total.branches.pct, thresholds.branches)} |
              
              \${total.lines.pct >= thresholds.lines && 
                total.statements.pct >= thresholds.statements && 
                total.functions.pct >= thresholds.functions && 
                total.branches.pct >= thresholds.branches
                ? '✅ **All coverage thresholds met!**'
                : '❌ **Coverage below required thresholds.**'}
              \`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  test-frontend-admin:
    name: Test Frontend Admin (Lint & Build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend-admin/package-lock.json
      - name: Install frontend-admin dependencies
        working-directory: ./frontend-admin
        run: npm ci
      - name: Run linter
        working-directory: ./frontend-admin
        run: npm run lint:check
      - name: Run type checker
        working-directory: ./frontend-admin
        run: npm run type-check
        continue-on-error: true
      - name: Build frontend-admin
        working-directory: ./frontend-admin
        env:
          DATABASE_URL: "mysql://mock_user:mock_password@localhost:3306/mock_db"
          NEXTAUTH_SECRET: "test-nextauth-secret-for-ci-only"
          NEXTAUTH_URL: "http://localhost:3001"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3002"
        run: npm run build

  test-frontend-user:
    name: Test Frontend User (Lint & Build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend-user/package-lock.json
      - name: Install frontend-user dependencies
        working-directory: ./frontend-user
        run: npm ci
      - name: Run linter
        working-directory: ./frontend-user
        run: npm run lint:check
      - name: Run type checker
        working-directory: ./frontend-user
        run: npm run type-check
        continue-on-error: true
      - name: Build frontend-user
        working-directory: ./frontend-user
        env:
          DATABASE_URL: "mysql://mock_user:mock_password@localhost:3306/mock_db"
          NEXTAUTH_SECRET: "test-nextauth-secret-for-ci-only"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3002"
        run: npm run build

  build-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-admin, test-frontend-user]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "📊 CI Pipeline Results:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Backend tests: ${{ needs.test-backend.result }}"
          echo "Frontend Admin: ${{ needs.test-frontend-admin.result }}"
          echo "Frontend User: ${{ needs.test-frontend-user.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ needs.test-backend.result }}" != "success" ]; then
            echo "❌ Backend tests failed - cannot merge"
            exit 1
          fi
          if [ "${{ needs.test-frontend-admin.result }}" != "success" ]; then
            echo "❌ Frontend Admin build failed - cannot merge"
            exit 1
          fi
          if [ "${{ needs.test-frontend-user.result }}" != "success" ]; then
            echo "❌ Frontend User build failed - cannot merge"
            exit 1
          fi
          echo "✅ All CI checks passed! Ready to merge."

      - name: Post Status Comment (on PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const backendStatus = '${{ needs.test-backend.result }}';
            const adminStatus = '${{ needs.test-frontend-admin.result }}';
            const userStatus = '${{ needs.test-frontend-user.result }}';

            const statusIcon = (status) => status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
            const allPassed = backendStatus === 'success' && adminStatus === 'success' && userStatus === 'success';

            const comment = `## 🚀 CI Pipeline Results

            | Component | Status | Result |
            |-----------|--------|--------|
            | **Backend Tests** | ${statusIcon(backendStatus)} | ${backendStatus} |
            | **Frontend Admin** | ${statusIcon(adminStatus)} | ${adminStatus} |
            | **Frontend User** | ${statusIcon(userStatus)} | ${userStatus} |

            ${allPassed 
              ? '✅ **All checks passed!** This PR is ready to merge.' 
              : '❌ **Some checks failed.** Please fix all errors before merging.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job tự động tạo issue khi CI fail
  create-issue-on-failure:
    name: Create Issue on CI Failure
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-admin, test-frontend-user]
    if: |
      always() && 
      (needs.test-backend.result == 'failure' || 
       needs.test-frontend-admin.result == 'failure' || 
       needs.test-frontend-user.result == 'failure')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Issue for CI Failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const backendStatus = '${{ needs.test-backend.result }}';
            const adminStatus = '${{ needs.test-frontend-admin.result }}';
            const userStatus = '${{ needs.test-frontend-user.result }}';
            
            const statusIcon = (status) => status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
            
            // Xác định component nào fail
            const failedComponents = [];
            if (backendStatus === 'failure') failedComponents.push('Backend Tests');
            if (adminStatus === 'failure') failedComponents.push('Frontend Admin');
            if (userStatus === 'failure') failedComponents.push('Frontend User');
            
            // Thông tin về commit/PR
            const sha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const actor = context.actor;
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            
            // Tạo title cho issue
            const isPR = context.eventName === 'pull_request';
            const prNumber = isPR ? context.payload.pull_request?.number : null;
            const issueTitle = isPR 
              ? `🔴 CI Failed on PR #${prNumber}: ${failedComponents.join(', ')}`
              : `🔴 CI Failed on branch \`${branch}\`: ${failedComponents.join(', ')}`;
            
            // Tạo body cho issue
            const issueBody = `## 🚨 CI Pipeline Failed
            
            **Triggered by:** @${actor}
            **Branch:** \`${branch}\`
            **Commit:** \`${sha}\`
            **Workflow Run:** [View Details](${runUrl})
            ${isPR ? `**Pull Request:** #${prNumber}` : ''}
            
            ---
            
            ### 📊 CI Results Summary
            
            | Component | Status |
            |-----------|--------|
            | **Backend Tests** | ${statusIcon(backendStatus)} ${backendStatus} |
            | **Frontend Admin** | ${statusIcon(adminStatus)} ${adminStatus} |
            | **Frontend User** | ${statusIcon(userStatus)} ${userStatus} |
            
            ---
            
            ### ❌ Failed Components
            
            ${failedComponents.map(c => `- **${c}**`).join('\n')}
            
            ---
            
            ### 🔍 How to Fix
            
            1. **Check the [workflow run logs](${runUrl})** để xem chi tiết lỗi
            2. **Chạy test locally** trước khi push:
               ${backendStatus === 'failure' ? '   - Backend: `cd backend && npm run test`' : ''}
               ${adminStatus === 'failure' ? '   - Frontend Admin: `cd frontend-admin && npm run lint:check && npm run build`' : ''}
               ${userStatus === 'failure' ? '   - Frontend User: `cd frontend-user && npm run lint:check && npm run build`' : ''}
            3. **Fix lỗi** và push lại code
            4. **Đóng issue này** khi CI pass
            
            ---
            
            ### 📝 Checklist
            
            - [ ] Đã xem logs và xác định nguyên nhân
            - [ ] Đã fix lỗi locally
            - [ ] Đã chạy test locally thành công
            - [ ] Đã push fix và CI pass
            
            ---
            
            > ⚡ Issue này được tạo tự động bởi CI workflow.
            > 🏷️ Gắn labels phù hợp để tracking.
            `;
            
            // Kiểm tra xem đã có issue tương tự chưa (tránh duplicate)
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 10
            });
            
            // Tìm issue có cùng branch/PR
            const duplicateIssue = existingIssues.data.find(issue => {
              return issue.title.includes(branch) || (prNumber && issue.title.includes(`PR #${prNumber}`));
            });
            
            if (duplicateIssue) {
              // Cập nhật comment vào issue cũ thay vì tạo mới
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicateIssue.number,
                body: `## 🔄 CI Failed Again\n\n**Commit:** \`${sha}\`\n**Run:** [View Details](${runUrl})\n\n${failedComponents.map(c => `- ❌ ${c}`).join('\n')}`
              });
              console.log(`Updated existing issue #${duplicateIssue.number}`);
            } else {
              // Tạo issue mới
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['ci-failure', 'bug', 'automated'],
                assignees: [actor]
              });
              console.log(`Created new issue #${newIssue.data.number}`);
            }

      - name: Add failure comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const backendStatus = '${{ needs.test-backend.result }}';
            const adminStatus = '${{ needs.test-frontend-admin.result }}';
            const userStatus = '${{ needs.test-frontend-user.result }}';
            
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const comment = `## ⛔ CI Failed - Cannot Merge
            
            This PR cannot be merged because CI checks have failed.
            
            | Component | Status |
            |-----------|--------|
            | Backend Tests | ${backendStatus === 'success' ? '✅' : '❌'} ${backendStatus} |
            | Frontend Admin | ${adminStatus === 'success' ? '✅' : '❌'} ${adminStatus} |
            | Frontend User | ${userStatus === 'success' ? '✅' : '❌'} ${userStatus} |
            
            👉 [View CI Logs](${runUrl})
            
            Please fix all failing checks before requesting review.
            `;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
