name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Prevent concurrent workflows
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P3306 -utest_user -ptest_password &> /dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Setup test database
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://test_user:test_password@127.0.0.1:3306/test_db
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://test_user:test_password@127.0.0.1:3306/test_db
          JWT_SECRET: test-jwt-secret-key
          DISABLE_EXTERNAL_CALLS: true
        run: |
          npm test -- --ci --coverage --maxWorkers=2 --forceExit
        continue-on-error: false

      - name: Check test results
        if: failure()
        run: |
          echo "❌ Tests failed! This PR cannot be merged."
          exit 1

      - name: Generate coverage report
        if: matrix.node-version == '20.x'
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://test_user:test_password@127.0.0.1:3306/test_db
          JWT_SECRET: test-jwt-secret-key
          DISABLE_EXTERNAL_CALLS: true
        run: npm run test:coverage -- --ci --maxWorkers=2 --forceExit
        continue-on-error: false

      - name: Check coverage thresholds
        if: matrix.node-version == '20.x'
        working-directory: ./backend
        run: |
          echo "Checking coverage thresholds..."
          node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const total = coverage.total;
            const thresholds = { lines: 70, functions: 60, branches: 60, statements: 70 };
            let failed = false;
            
            Object.keys(thresholds).forEach(key => {
              const actual = total[key].pct;
              const threshold = thresholds[key];
              console.log(\`\${key}: \${actual}% (threshold: \${threshold}%)\`);
              if (actual < threshold) {
                console.error(\`❌ Coverage for \${key} (\${actual}%) is below threshold (\${threshold}%)\`);
                failed = true;
              }
            });
            
            if (failed) {
              console.error('❌ Coverage thresholds not met!');
              process.exit(1);
            }
            console.log('✅ All coverage thresholds met!');
          "
        continue-on-error: false

      - name: Upload coverage to Codecov (optional)
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            backend/coverage/
            backend/test-results/
          retention-days: 30

  test-frontend-admin:
    name: Test Frontend Admin
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install frontend-admin dependencies
        working-directory: ./frontend-admin
        run: npm ci

      - name: Run linter
        working-directory: ./frontend-admin
        run: npm run lint || echo "Linter not configured yet"
        continue-on-error: true

      - name: Build frontend-admin
        working-directory: ./frontend-admin
        run: npm run build

      # Uncomment when tests are added
      # - name: Run tests
      #   working-directory: ./frontend-admin
      #   run: npm test

  test-frontend-user:
    name: Test Frontend User
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend-user/package-lock.json

      - name: Install frontend-user dependencies
        working-directory: ./frontend-user
        run: npm ci

      - name: Run linter
        working-directory: ./frontend-user
        run: npm run lint || echo "Linter not configured yet"
        continue-on-error: true

      - name: Build frontend-user
        working-directory: ./frontend-user
        run: npm run build

      # Uncomment when tests are added
      # - name: Run tests
      #   working-directory: ./frontend-user
      #   run: npm test

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-admin, test-frontend-user]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Backend tests: ${{ needs.test-backend.result }}"
          echo "Frontend Admin tests: ${{ needs.test-frontend-admin.result }}"
          echo "Frontend User tests: ${{ needs.test-frontend-user.result }}"

          if [ "${{ needs.test-backend.result }}" != "success" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi

          if [ "${{ needs.test-frontend-admin.result }}" != "success" ]; then
            echo "❌ Frontend Admin build failed"
            exit 1
          fi

          if [ "${{ needs.test-frontend-user.result }}" != "success" ]; then
            echo "❌ Frontend User build failed"
            exit 1
          fi

          echo "✅ All checks passed!"
