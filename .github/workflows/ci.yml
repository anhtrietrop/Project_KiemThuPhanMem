name: CI Pipeline

on:
  # Trigger on push to any branch (for testing)
  push:
    branches:
      - "**"

  # Trigger on pull requests to main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  # Allow manual workflow dispatch
  workflow_dispatch:

# Prevent concurrent workflows
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Test Backend (Unit & Integration)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [18.x]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword123
          MYSQL_DATABASE: test_ecommerce_db
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P3307 -uroot -prootpassword123 &> /dev/null; then
              echo "✅ MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Create Test Environment File
        working-directory: ./backend
        run: |
          cat > .env.test << EOF
          NODE_ENV=test
          DATABASE_URL="mysql://root:rootpassword123@127.0.0.1:3307/test_ecommerce_db"
          TEST_DATABASE_URL="mysql://root:rootpassword123@127.0.0.1:3307/test_ecommerce_db"
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          JWT_EXPIRES_IN="24h"
          MOMO_ACCESS_KEY="${{ secrets.MOMO_ACCESS_KEY }}"
          MOMO_SECRET_KEY="${{ secrets.MOMO_SECRET_KEY }}"
          MOMO_PARTNER_CODE="${{ secrets.MOMO_PARTNER_CODE }}"
          MOMO_ENDPOINT="https://test-payment.momo.vn/v2/gateway/api/create"
          MOMO_REDIRECT_URL="http://localhost:3000/payment/callback"
          MOMO_IPN_URL="http://localhost:3000/api/payment/momo/ipn"
          TEST_TIMEOUT=10000
          DISABLE_EXTERNAL_CALLS=true
          MOCK_SERVICES=true
          EOF

      - name: Setup test database
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:rootpassword123@127.0.0.1:3307/test_ecommerce_db
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          NODE_ENV: test
          CI: true
        run: npm run test:coverage -- --ci --forceExit
        continue-on-error: false

      - name: Check coverage thresholds
        working-directory: ./backend
        run: |
          echo "📊 Checking coverage thresholds..."
          node -e "
            try {
              const coverage = require('./coverage/coverage-summary.json');
              const total = coverage.total;
              const thresholds = { lines: 60, statements: 60, functions: 50, branches: 50 };
              let failed = false;
              
              Object.keys(thresholds).forEach(key => {
                const actual = total[key].pct;
                const threshold = thresholds[key];
                const icon = actual >= threshold ? '✅' : '❌';
                console.log(\`\${icon} \${key}: \${actual}% (threshold: \${threshold}%)\`);
                if (actual < threshold) {
                  console.error(\`❌ Coverage for \${key} (\${actual}%) is below threshold (\${threshold}%)\`);
                  failed = true;
                }
              });
              
              if (failed) {
                console.error('\\n❌ Coverage thresholds not met! Cannot merge PR.');
                process.exit(1);
              }
              console.log('\\n✅ All coverage thresholds met!');
            } catch (e) {
              console.error('❌ Could not read coverage summary:', e.message);
              process.exit(1);
            }
          "
        continue-on-error: false

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            backend/coverage/
          retention-days: 30

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coveragePath = './backend/coverage/coverage-summary.json';

            if (fs.existsSync(coveragePath)) {
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const total = coverage.total;
              
              const statusIcon = (actual, threshold) => actual >= threshold ? '✅' : '❌';
              
              const comment = \`## 📊 Backend Test Coverage Report
              
              | Metric | Coverage | Threshold | Status |
              |--------|----------|-----------|--------|
              | **Lines** | ${total.lines.pct}% | 60% | ${statusIcon(total.lines.pct, 60)} |
              | **Statements** | ${total.statements.pct}% | 60% | ${statusIcon(total.statements.pct, 60)} |
              | **Functions** | ${total.functions.pct}% | 50% | ${statusIcon(total.functions.pct, 50)} |
              | **Branches** | ${total.branches.pct}% | 50% | ${statusIcon(total.branches.pct, 50)} |
              
              ${total.lines.pct >= 60 && total.statements.pct >= 60 && total.functions.pct >= 50 && total.branches.pct >= 50
                ? '✅ **All coverage thresholds met!**'
                : '❌ **Coverage below required thresholds. Cannot merge.**'}
              \`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  test-frontend-admin:
    name: Test Frontend Admin (Lint & Build)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install frontend-admin dependencies
        working-directory: ./frontend-admin
        run: npm ci

      - name: Run linter
        working-directory: ./frontend-admin
        run: npm run lint:check

      - name: Run type checker
        working-directory: ./frontend-admin
        run: npm run type-check

      - name: Build frontend-admin
        working-directory: ./frontend-admin
        env:
          DATABASE_URL: "mysql://mock_user:mock_password@localhost:3306/mock_db"
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: "http://localhost:3001"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3002"
        run: npm run build

  test-frontend-user:
    name: Test Frontend User (Lint & Build)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend-user/package-lock.json

      - name: Install frontend-user dependencies
        working-directory: ./frontend-user
        run: npm ci

      - name: Run linter
        working-directory: ./frontend-user
        run: npm run lint:check

      - name: Run type checker
        working-directory: ./frontend-user
        run: npm run type-check

      - name: Build frontend-user
        working-directory: ./frontend-user
        env:
          DATABASE_URL: "mysql://mock_user:mock_password@localhost:3306/mock_db"
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3002"
        run: npm run build

  build-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-admin, test-frontend-user]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "📊 CI Pipeline Results:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Backend tests: ${{ needs.test-backend.result }}"
          echo "Frontend Admin: ${{ needs.test-frontend-admin.result }}"
          echo "Frontend User: ${{ needs.test-frontend-user.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ needs.test-backend.result }}" != "success" ]; then
            echo "❌ Backend tests failed - cannot merge"
            exit 1
          fi

          if [ "${{ needs.test-frontend-admin.result }}" != "success" ]; then
            echo "❌ Frontend Admin build failed - cannot merge"
            exit 1
          fi

          if [ "${{ needs.test-frontend-user.result }}" != "success" ]; then
            echo "❌ Frontend User build failed - cannot merge"
            exit 1
          fi

          echo "✅ All CI checks passed! Ready to merge."

      - name: Post Status Comment (on PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const backendStatus = '${{ needs.test-backend.result }}';
            const adminStatus = '${{ needs.test-frontend-admin.result }}';
            const userStatus = '${{ needs.test-frontend-user.result }}';

            const statusIcon = (status) => status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';

            const allPassed = backendStatus === 'success' && adminStatus === 'success' && userStatus === 'success';

            const comment = `## 🚀 CI Pipeline Results

            | Component | Status | Result |
            |-----------|--------|--------|
            | **Backend Tests** | ${statusIcon(backendStatus)} | ${backendStatus} |
            | **Frontend Admin** | ${statusIcon(adminStatus)} | ${adminStatus} |
            | **Frontend User** | ${statusIcon(userStatus)} | ${userStatus} |

            ${allPassed 
              ? '✅ **All checks passed!** This PR is ready to merge.' 
              : '❌ **Some checks failed.** Please fix all errors before merging.'}

            ---

            **Backend Tests:** Unit + Integration tests with MySQL, coverage thresholds enforced
            **Frontend Checks:** Linting, Type-checking, Build verification
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
