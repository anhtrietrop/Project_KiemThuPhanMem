name: CD Pipeline (Continuous Deployment)

on:
  # Trigger ONLY on successful push to main branch
  push:
    branches:
      - main

  # Allow manual workflow dispatch
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend-user, frontend-admin]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix={{date 'YYYYMMDD'}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build single arch to speed up CI. Change to multi-arch only if needed.
          platforms: linux/amd64

      - name: Image Digest
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Service: ${{ matrix.service }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
          echo "🔗 Registry: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Notification
        run: |
          echo "🚀 Deployment triggered for commit ${{ github.sha }}"
          echo "📦 Docker images built and pushed to GitHub Container Registry"
          echo "🔗 Images available at: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Available images:"
          echo "  🔹 backend:       ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest"
          echo "  🔹 frontend-user: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend-user:latest"
          echo "  🔹 frontend-admin: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend-admin:latest"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📝 Next steps:"
          echo "  1. SSH to your production server"
          echo "  2. Pull the latest images: docker compose pull"
          echo "  3. Restart services: docker compose up -d --force-recreate"

      # ========================================
      # OPTION 1: Deploy via SSH to VPS/Server
