name: CD Pipeline (Continuous Deployment)

on:
  # Trigger ONLY on successful push to main branch
  push:
    branches:
      - main

  # Allow manual workflow dispatch
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend-user, frontend-admin]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix={{date 'YYYYMMDD'}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Digest
        run: echo "Image pushed successfully! Tags - ${{ steps.meta.outputs.tags }}"

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Notification
        run: |
          echo "🚀 Deployment triggered for commit ${{ github.sha }}"
          echo "📦 Docker images built and pushed to GitHub Container Registry"
          echo "🔗 Images available at: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"
          echo ""
          echo "Available images:"
          echo "  - backend: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest"
          echo "  - frontend-user: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend-user:latest"
          echo "  - frontend-admin: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend-admin:latest"

      # OPTIONAL: Uncomment and configure if you have a deployment server
      # - name: Deploy to Production Server
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     port: ${{ secrets.DEPLOY_PORT }}
      #     script: |
      #       cd /path/to/your/app
      #       docker compose pull
      #       docker compose up -d --force-recreate
      #       docker image prune -f

      # OPTIONAL: Kubernetes deployment example
      # - name: Deploy to Kubernetes
      #   uses: azure/k8s-deploy@v4
      #   with:
      #     manifests: |
      #       k8s/deployment.yaml
      #       k8s/service.yaml
      #     images: |
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend-user:${{ github.sha }}
      #       ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend-admin:${{ github.sha }}

  notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send Slack Notification (Optional)
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "To send Slack notifications, configure SLACK_WEBHOOK_URL secret"
          # Example Slack notification:
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"✅ Deployment successful for commit ${{ github.sha }}"}'

      - name: Send Failure Notification (Optional)
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          # Add your notification logic here
